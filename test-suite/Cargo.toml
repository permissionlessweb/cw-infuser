[package]
name = "test-suite"
version = "0.1.0"
edition = "2021"


[lib]
crate-type = ["cdylib", "rlib"]


[features]
# use library feature to disable all instantiate/execute/query exports
library = []
default = []
vanilla = []


[dependencies]
cw-infuser-scripts = { workspace = true }
cw-infusions = { workspace = true }
cw-infusion-minter = { workspace = true,features = ["interface"] }
cw721-svg = { path = "../contracts/cw721/cw721-svg", features = ["library","interface"] }
cw-svg = { path = "../packages/cw-svg" }
cw2= { workspace = true }
cw-orch = { workspace = true, features = ["daemon"] }
cosmwasm-std = { workspace = true }
cosmwasm-schema = { workspace = true }
cw-storage-plus = { workspace = true }
cw721 = { workspace = true }
cw721-base = { workspace = true }
cw-utils = "1.0.3"
anyhow = { workspace = true }
serde = { workspace = true }
schemars= { workspace = true }
whitelist-mtree = { path = "../contracts/whitelist/whitelist-merkletree", features = ["library", "interface"] }

[dev-dependencies]
rand = "0.8.5"
cw-multi-test = "1.2.0"
abstract-cw-multi-test = { version = "1.0.1" }
rs_merkle = { version = "1.4.1", default-features = false }

