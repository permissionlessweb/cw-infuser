[package]
name = "test-suite"
version = "0.1.0"
edition = "2021"


[lib]
crate-type = ["cdylib", "rlib"]


[features]
# use library feature to disable all instantiate/execute/query exports
library = []
default = []
vanilla = []


[dependencies]
cw-infuser-scripts = { workspace = true }
cw-infusions = { workspace = true }
cw-infusion-minter = { workspace = true }
cw721-svg = { path = "../contracts/cw721/cw721-svg", features = ["library"] }
cw-svg = { path = "../packages/cw-svg" }

cw2= { workspace = true }
cw-orch = { workspace = true, features = ["daemon"] }
cosmwasm-std = { workspace = true }
cosmwasm-schema = { workspace = true }
cw-storage-plus = { workspace = true }
cw721 = { workspace = true }
cw721-base = { workspace = true }
cw-utils = "1.0.3"

anyhow = { workspace = true }
serde = { workspace = true }
schemars= { workspace = true }

#  For gating
whitelist-mtree = { path = "../contracts/whitelist/whitelist-merkletree", features = ["library"] }
 

# v020infuse = {  branch = "v020-migrate",package="cw-infuser",git = "https://github.com/permissionlessweb/cw-infuser"}
# v020scripts =  {  branch = "v020-migrate",package="scripts",git = "https://github.com/permissionlessweb/cw-infuser"}

[dev-dependencies]
rand = "0.8.5"
cw-multi-test = "2.4.0"
abstract-cw-multi-test = { version = "1.0.1" }
rs_merkle = { version = "1.4.1", default-features = false }

