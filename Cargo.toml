[workspace]
members = [
    "contracts/cw-infuser",
    "contracts/cw721/*",
    "contracts/whitelist/*",
    "packages/cw-infusions",
    "packages/cw-svg",
    "packages/easy-addr",
    "scripts",
    "test-suite",
]
resolver = "2"

[workspace.package]
repository = "https://github.com/permissionlessweb/cw-infuser"
edition = "2021"
resolver = "2"
homepage = "https://permissionless.money"
version = "0.7.3"
authors = ["hard-nett <hardnettt@proton.me>"]
license = "MIT"

[workspace.features]
default = []

[workspace.dependencies]

anyhow = "1.0.79"
blake3 = "1.8.3"
cosmwasm-schema = "1.5.11"
cosmwasm-std = { version = "1.5.11", features = ["cosmwasm_1_4"] }
cw-controllers = { version = "1.1.2" }
cw-infuser-scripts = { path = "./scripts", default-features = false }
cw-infusion-minter = { path = "./contracts/cw-infuser" }
cw-infusions = { path = "./packages/cw-infusions" }
cw-orch = { version = "0.24.1" }
cw-storage-plus = "1.2.0"
cw-utils = "1.0.3"
cw2 = "1.1.2"
cw721 =  "0.18.0"
cw721-base  = { version = "0.18.0", features = ["library"] }
schemars = "0.8.16"
semver                      = "1"
serde = { version = "1.0.197", default-features = false, features = ["derive"] }
sha2                 = { version = "0.10.2", default-features = false }
thiserror = { version = "1.0.58" }
url                  = "2.2.2"
whitelist-mtree = { path = "./contracts/whitelist/whitelist-merkletree" }

[profile.release]
rpath = false
lto = true
overflow-checks = true
opt-level = 3
debug = false
debug-assertions = false
