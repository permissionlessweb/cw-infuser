<svg xmlns="http://www.w3.org/2000/svg" width="850.94" height="509.61" viewBox="0 0 850.94 509.61" fill="none">
  <defs>
    <style>
      #penumbra-orb {
        transform-origin: 425px 255px;
        animation: penumbra-breath ${breath-orb}s ease-in-out infinite alternate;
      }
      @keyframes penumbra-breath {
        from { 
          opacity: 0.94; 
          transform: scale(0.975); 
        }
        to { 
          opacity: 1.00; 
          transform: scale(1.018); 
        }
      }
    </style>

    <!-- Elegant cosmic radial gradient – exactly matches original flow and feel -->
    <radialGradient id="penumbra-gradient" cx="50%" cy="48%" r="68%" fx="38%" fy="35%" gradientUnits="objectBoundingBox">
      <stop offset="0%"   stop-color="${color-core}"/>
      <stop offset="13%"  stop-color="${color-core}"/>
      <stop offset="33%"  stop-color="${color-warm}"/>
      <stop offset="75%"  stop-color="${color-accent}"/>
      <stop offset="81%"  stop-color="${color-accent}"/>
      <stop offset="94%"  stop-color="${color-glow}"/>
      <stop offset="100%" stop-color="${color-glow}"/>
    </radialGradient>
  </defs>

