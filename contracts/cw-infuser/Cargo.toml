[package]
name = "cw-infusion-minter"
version  = { workspace = true }
authors = ["hard-nett <hardnettt@proton.me>"]
edition = "2021"
exclude = ["scripts"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = 3
debug = false
rpath = false
lto = true
debug-assertions = false
codegen-units = 1
panic = 'abort'
incremental = false
overflow-checks = true

[features]
# use library feature to disable all instantiate/execute/query exports
library = []

[dependencies]
cw-controllers =  { workspace = true }
cw2 =  { workspace = true }
cosmwasm-schema  = {workspace = true }
cw-storage-plus =  { workspace = true }
cosmwasm-std = { workspace = true, features = [
  "cosmwasm_1_4",
  
] }
cw721 =  { workspace = true }
cw721-base  = { workspace = true, features = ["library"] }
cw-infusions = {workspace = true }
cw-orch =  { workspace = true }
sha2 = { version = "0.10.8", default-features = false }
semver                      = "1"
thiserror = { version = "1.0.58" }
url                  = "2.2.2"
shuffle         = { git = "https://github.com/webmaster128/shuffle", branch = "rm-getrandom", version = "0.1.7" }
rand_xoshiro    = { version = "0.6.0", default-features = false }
nois            = { version = "2.0.0" }

 
[dev-dependencies]
cw-multi-test = "1.2.0"